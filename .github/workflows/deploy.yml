name: CI/CD to Local IIS (.NET Core)

on:
  push:
    branches: [ "main" ] # Triggers whenever code is pushed to main

jobs:
  deploy:
    runs-on: [self-hosted, iis-servercicd] # Targets your local machine runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # Match your app's version
      env:
        # Forces .NET to install inside the runner's user profile space instead of Program Files
        DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet  

    - name: Stop IIS Website
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "MultiDashboard"
      shell: powershell

    - name: Publish and Deploy Application
      run: |
        dotnet publish -c Release -o "C:\inetpub\wwwroot\MultiDashboard\Publish"
      shell: powershell

    - name: Start IIS Website
      if: always() # Ensures the site turns back on even if the build failed
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "MultiDashboard"
      shell: powershell
